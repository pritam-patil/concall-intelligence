[project]
name = "ingest"
version = "0.1.0"
description = "Ingestion pipeline for NSE filings and earnings-call transcripts (fetch, parse, chunk, embed, store)."
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "supabase>=2.6",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ingest = "ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"
